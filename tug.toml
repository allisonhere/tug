version = 1

[defaults]
remote = "origin"
base_branch = "main"
confirm = "destructive"

[ui]
theme = "tide"

[profiles.local]
description = "fast loop: no remote, no CI"

[profiles.ci]
env = { CI = "1" }

# ---------------------------------------------------------------------------
# check — everything that must pass before a commit
# ---------------------------------------------------------------------------

[pipelines.check]
description = "Format, lint, and test"
order = 10

steps = [
  { action = "shell", label = "fmt", run = "cargo fmt --all --check", timeout = 120 },
  { action = "shell", label = "clippy", run = "cargo clippy --all-targets -- -D warnings", timeout = 600 },
  { action = "shell", label = "test", run = "cargo test", timeout = 600 },
]

# ---------------------------------------------------------------------------
# push — stage everything, commit, push
# ---------------------------------------------------------------------------

[pipelines.push]
description = "Stage everything, commit, and push"
order = 20

steps = [
  { action = "git.stage", all = true },
  { action = "git.commit", message = "{{ message | chore: update }}" },
  { action = "git.push", set_upstream = true },
]

# ---------------------------------------------------------------------------
# pr — push, open or update the pull request, then watch CI
# ---------------------------------------------------------------------------

[pipelines.pr]
description = "Push, open or update a pull request, then watch CI"
order = 30
when = { branch = "*" }

steps = [
  { action = "git.push", set_upstream = true },
  { action = "github.pr", base = "main", update = true },
  { action = "github.watch", timeout_secs = 1800 },
]

# ---------------------------------------------------------------------------
# release — bump, tag, push the tag, publish the GitHub release
# ---------------------------------------------------------------------------

[pipelines.release]
description = "Bump the version, tag it, push, and publish a GitHub release"
order = 40
when = { clean = true }

steps = [
  { action = "bump", part = "patch" },
  { action = "git.tag", name = "{{ version_tag }}", message = "release {{ version }}", push = true },
  { action = "github.release", tag = "{{ version_tag }}", generate_notes = true, update = true },
]
